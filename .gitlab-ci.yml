stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"
  DJANGO_SETTINGS_MODULE: config.settings_test
  DBNAME: djangogeoexporter_test
  DBUSER: postgres
  DBPASSWORD: postgres
  DBHOST: postgres
  DBPORT: "5432"
  POSTGRES_DB: djangogeoexporter_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

.python-test:
  stage: test
  cache:
    key: "python-$CI_JOB_NAME_SLUG"
    paths:
      - .cache/pip
      - .cache/poetry
  before_script:
    - pip install poetry==2.4.1
    - poetry config virtualenvs.in-project true

unit:
  extends: .python-test
  image: python:3.14-slim
  script:
    - poetry install --only main,test
    - poetry run pytest tests/test_core.py

integration:
  extends: .python-test
  image: python:3.14-slim
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gdal-bin libgdal-dev
    - pip install poetry==2.4.1
    - poetry config virtualenvs.in-project true
    - poetry install --only main,test -E all
  script:
    - poetry run python manage.py makemigrations --check --dry-run
    - poetry run coverage run -m pytest
    - poetry run coverage report --show-missing --fail-under=75
